- name: Deploy HDFS cluster (NN + SNN + 3xDN)
  hosts: cluster
  become: true
  vars:
    hadoop_tgz: "hadoop-{{ hadoop_version }}.tar.gz"
    hadoop_url: "{{ hadoop_mirror }}/hadoop-{{ hadoop_version }}/{{ hadoop_tgz }}"
    hadoop_extract_dir: "{{ hadoop_install_dir }}/hadoop-{{ hadoop_version }}"
    yarn_rm_host: nn
    yarn_history_host: nn


    # /etc/hosts content
    hosts_entries:
      - { ip: "192.168.10.52", name: "jn" }
      - { ip: "192.168.10.28", name: "nn" }
      - { ip: "192.168.10.26", name: "dn-00" }
      - { ip: "192.168.10.27", name: "dn-01" }

  tasks:
    - name: Ensure /etc/hosts has cluster hostnames
      lineinfile:
        path: /etc/hosts
        line: "{{ item.ip }} {{ item.name }}"
        state: present
      loop: "{{ hosts_entries }}"

    - name: Install Java and base utils
      apt:
        name:
          - "{{ java_pkg }}"
          - curl
          - tar
        state: present
        update_cache: true

    - name: Create hadoop group
      group:
        name: hadoop
        state: present

    - name: Create hadoop user
      user:
        name: hadoop
        group: hadoop
        create_home: true
        shell: /bin/bash
        state: present

    - name: Create HDFS directories
      file:
        path: "{{ item }}"
        state: directory
        owner: hadoop
        group: hadoop
        mode: "0755"
      loop:
        - /data/hdfs
        - "{{ namenode_dir }}"
        - "{{ datanode_dir }}"
        - /var/log/hadoop-hdfs
        - /var/run/hadoop

    - name: Download Hadoop tarball (once per host)
      get_url:
        url: "{{ hadoop_url }}"
        dest: "/tmp/{{ hadoop_tgz }}"
        mode: "0644"

    - name: Extract Hadoop
      unarchive:
        src: "/tmp/{{ hadoop_tgz }}"
        dest: "{{ hadoop_install_dir }}"
        remote_src: true
        creates: "{{ hadoop_extract_dir }}/bin/hdfs"

    - name: Symlink /opt/hadoop -> extracted dir
      file:
        src: "{{ hadoop_extract_dir }}"
        dest: "{{ hadoop_home }}"
        state: link
        force: true

    - name: Deploy Hadoop configs
      template:
        src: "{{ item.src }}"
        dest: "{{ hadoop_home }}/etc/hadoop/{{ item.dest }}"
        owner: hadoop
        group: hadoop
        mode: "0644"
      loop:
        - { src: "core-site.xml.j2", dest: "core-site.xml" }
        - { src: "hdfs-site.xml.j2", dest: "hdfs-site.xml" }
        - { src: "hadoop-env.sh.j2", dest: "hadoop-env.sh" }
        - { src: "yarn-site.xml.j2", dest: "yarn-site.xml" }
        - { src: "mapred-site.xml.j2", dest: "mapred-site.xml" }
        - { src: "hadoop-env.sh.j2", dest: "hadoop-env.sh" }
    - name: Install systemd units for HDFS services
      template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: "hdfs-namenode.service.j2", dest: "hdfs-namenode.service" }
        - { src: "hdfs-datanode.service.j2", dest: "hdfs-datanode.service" }
        - { src: "hdfs-secondarynamenode.service.j2", dest: "hdfs-secondarynamenode.service" }
        - { src: "yarn-resourcemanager.service.j2", dest: "yarn-resourcemanager.service" }
        - { src: "yarn-nodemanager.service.j2", dest: "yarn-nodemanager.service" }
        - { src: "mapreduce-historyserver.service.j2", dest: "mapreduce-historyserver.service" }

    - name: Reload systemd
      systemd:
        daemon_reload: true

- name: Format NameNode (only once)
  hosts: namenode
  become: true
  tasks:
    - name: Check if NameNode already formatted
      stat:
        path: "{{ namenode_dir }}/current/VERSION"
      register: nn_version

    - name: Format NameNode if not formatted yet
      become: true
      command: "sudo -u hadoop {{ hadoop_home }}/bin/hdfs namenode -format -force"
      when: not nn_version.stat.exists


- name: Start/enable HDFS services
  hosts: cluster
  become: true
  tasks:
    - name: Enable and start NameNode on nn
      systemd:
        name: hdfs-namenode
        enabled: true
        state: started
      when: inventory_hostname in groups['namenode']

    - name: Enable and start SecondaryNameNode on jn
      systemd:
        name: hdfs-secondarynamenode
        enabled: true
        state: started
      when: inventory_hostname in groups['secondary']

    - name: Enable and start DataNode on all datanodes
      systemd:
        name: hdfs-datanode
        enabled: true
        state: started
      when: inventory_hostname in groups['datanodes']

- name: Start/enable YARN services
  hosts: cluster
  become: true
  tasks:
    - name: Enable and start ResourceManager on nn
      systemd:
        name: yarn-resourcemanager
        enabled: true
        state: started
      when: inventory_hostname in groups['yarn_rm']

    - name: Enable and start JobHistoryServer on nn
      systemd:
        name: mapreduce-historyserver
        enabled: true
        state: started
      when: inventory_hostname in groups['yarn_history']

    - name: Enable and start NodeManager on yarn nodes
      systemd:
        name: yarn-nodemanager
        enabled: true
        state: started
      when: inventory_hostname in groups['yarn_nodemgrs']

- name: Publish Hadoop/YARN web UIs externally via nginx on jn
  hosts: proxy
  become: true
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy nginx config for Hadoop UIs
      template:
        src: nginx-hadoop-uis.conf.j2
        dest: /etc/nginx/conf.d/hadoop-uis.conf
        mode: "0644"

    - name: Test nginx config
      command: nginx -t

    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: true

- name: Deploy PostgreSQL for Hive metastore (nn)
  hosts: hive_db
  become: true
  vars_files:
    - group_vars/hive.yml
  tasks:
    - name: Install PostgreSQL and JDBC package
      apt:
        name:
          - postgresql
          - "{{ postgres_jdbc_pkg }}"
        state: present
        update_cache: true

    - name: Ensure PostgreSQL is running
      systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Create metastore DB user
      become_user: postgres
      shell: |
        psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ hive_db_user }}'" | grep -q 1 || \
        psql -c "CREATE USER {{ hive_db_user }} WITH PASSWORD '{{ hive_db_password }}';"
      args:
        executable: /bin/bash

    - name: Create metastore database
      become_user: postgres
      shell: |
        psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ hive_db_name }}'" | grep -q 1 || \
        psql -c "CREATE DATABASE {{ hive_db_name }} OWNER {{ hive_db_user }};"
      args:
        executable: /bin/bash


- name: Deploy Apache Hive binaries and config (nn + clients)
  hosts: hive_metastore:hive_hs2:hive_clients
  become: true
  vars_files:
    - group_vars/hive.yml
  tasks:
    - name: Install base tools
      apt:
        name:
          - curl
          - tar
        state: present
        update_cache: true

    - name: Download Hive tarball
      get_url:
        url: "{{ hive_url }}"
        dest: "/tmp/{{ hive_tgz }}"
        mode: "0644"

    - name: Extract Hive
      unarchive:
        src: "/tmp/{{ hive_tgz }}"
        dest: "{{ hive_install_dir }}"
        remote_src: true
        creates: "{{ hive_extract_dir }}/bin/hive"

    - name: Symlink /opt/hive -> extracted dir
      file:
        src: "{{ hive_extract_dir }}"
        dest: "{{ hive_home }}"
        state: link
        force: true

    - name: Ensure Hive conf dir exists
      file:
        path: "{{ hive_home }}/conf"
        state: directory
        owner: hadoop
        group: hadoop
        mode: "0755"

    - name: Deploy hive-site.xml
      template:
        src: hive-site.xml.j2
        dest: "{{ hive_home }}/conf/hive-site.xml"
        owner: hadoop
        group: hadoop
        mode: "0644"

    - name: Add Hadoop conf symlinks into Hive conf (core/hdfs/yarn/mapred)
      file:
        src: "{{ hadoop_home }}/etc/hadoop/{{ item }}"
        dest: "{{ hive_home }}/conf/{{ item }}"
        state: link
        force: true
      loop:
        - core-site.xml
        - hdfs-site.xml
        - yarn-site.xml
        - mapred-site.xml

    - name: Copy PostgreSQL JDBC jar into Hive lib (on nn where services run)
      copy:
        src: "{{ postgres_jdbc_jar }}"
        dest: "{{ hive_home }}/lib/postgresql-jdbc.jar"
        remote_src: true
        owner: hadoop
        group: hadoop
        mode: "0644"
      when: inventory_hostname in groups['hive_metastore'] or inventory_hostname in groups['hive_hs2']


- name: Prepare HDFS dirs for Hive (warehouse, scratch)
  hosts: hive_clients
  become: true
  vars_files:
    - group_vars/hive.yml
  tasks:
    - name: Create /tmp and warehouse directories in HDFS
      shell: |
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -mkdir -p /tmp
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -chmod 1777 /tmp

        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -mkdir -p {{ hive_warehouse_dir }}
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -chmod 0777 {{ hive_warehouse_dir }}

        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -mkdir -p {{ hive_scratch_dir }}
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -chmod 0777 {{ hive_scratch_dir }}
      args:
        executable: /bin/bash


- name: Install systemd units for Hive services (nn)
  hosts: hive_metastore:hive_hs2
  become: true
  vars_files:
    - group_vars/hive.yml
  tasks:
    - name: Install hive-metastore systemd unit
      template:
        src: hive-metastore.service.j2
        dest: /etc/systemd/system/hive-metastore.service
        mode: "0644"
      when: inventory_hostname in groups['hive_metastore']

    - name: Install hiveserver2 systemd unit
      template:
        src: hiveserver2.service.j2
        dest: /etc/systemd/system/hiveserver2.service
        mode: "0644"
      when: inventory_hostname in groups['hive_hs2']

    - name: Reload systemd
      systemd:
        daemon_reload: true


- name: Initialize Hive metastore schema (only once) and start services (nn)
  hosts: hive_metastore:hive_hs2
  become: true
  vars_files:
    - group_vars/hive.yml
  tasks:
    - name: Check if metastore schema already initialized (postgres has VERSION table)
      become_user: postgres
      shell: |
        psql -d {{ hive_db_name }} -tc "SELECT to_regclass('public.VERSION');"
      register: schema_check
      changed_when: false

    - name: Initialize schema if not present
      shell: |
        sudo -u hadoop {{ hive_home }}/bin/schematool -dbType postgres -initSchema --verbose
      when: "'version' not in (schema_check.stdout | lower)"
      args:
        executable: /bin/bash
      when: inventory_hostname in groups['hive_metastore']

    - name: Enable and start hive-metastore
      systemd:
        name: hive-metastore
        enabled: true
        state: started
      when: inventory_hostname in groups['hive_metastore']

    - name: Enable and start hiveserver2
      systemd:
        name: hiveserver2
        enabled: true
        state: started
      when: inventory_hostname in groups['hive_hs2']


- name: Automated load into partitioned Hive table
  hosts: hive_clients
  become: true
  vars_files:
    - group_vars/hive.yml
  tasks:
    - name: Upload sample data to HDFS partition paths
      shell: |
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -mkdir -p /tmp/hive_input/dt=2026-03-01
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -mkdir -p /tmp/hive_input/dt=2026-03-02

        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -put -f {{ playbook_dir }}/files/sample_2026-03-01.csv /tmp/hive_input/dt=2026-03-01/data.csv
        sudo -u hadoop {{ hadoop_home }}/bin/hdfs dfs -put -f {{ playbook_dir }}/files/sample_2026-03-02.csv /tmp/hive_input/dt=2026-03-02/data.csv
      args:
        executable: /bin/bash

    - name: Create partitioned table
      shell: |
        sudo -u hadoop {{ hive_home }}/bin/beeline -u jdbc:hive2://{{ hive_hs2_host }}:{{ hive_hs2_port }}/default -n hadoop -f {{ playbook_dir }}/hive_scripts/01_create_partitioned_table.hql
      args:
        executable: /bin/bash

    - name: Load data into partitions and validate counts
      shell: |
        sudo -u hadoop {{ hive_home }}/bin/beeline -u jdbc:hive2://{{ hive_hs2_host }}:{{ hive_hs2_port }}/default -n hadoop -f {{ playbook_dir }}/hive_scripts/02_load_partitions.hql
      args:
        executable: /bin/bash
